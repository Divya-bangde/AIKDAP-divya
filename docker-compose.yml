services:
  postgres:
    # Sprint 9C: the stock `postgres:17` image does not ship pgvector
    # at all (`pg_available_extensions` returned zero rows for
    # 'vector' -- confirmed live before switching). `pgvector/pgvector`
    # is the official image: identical to `postgres:17`, same major
    # version, same data directory format, plus the extension's
    # shared libraries. Swapping it is safe for the existing
    # `postgres_data` volume -- no dump/restore needed -- and
    # `CREATE EXTENSION` is still applied explicitly via Alembic, not
    # assumed from the image alone.
    image: pgvector/pgvector:pg17
    container_name: aikdap_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: aikdap_redis
    restart: unless-stopped

    ports:
      - "6380:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend

    container_name: aikdap_backend

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    env_file:
      - .env

    ports:
      - "8001:8000"

    volumes:
      - ./backend:/app

    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend

    container_name: aikdap_worker

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    env_file:
      - .env

    volumes:
      - ./backend:/app

    command: celery -A app.workers.worker worker --loglevel=info

volumes:
  postgres_data:
  redis_data:
